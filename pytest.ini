[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --disable-warnings --maxfail=1
norecursedirs = venv .git __pycache__ migrations
log_cli = true
log_level = INFO
markers =
    unit: tests unitaires
    integration: tests d'intégration Flask
    functional: tests fonctionnels complets
    performance: tests de performance
    security: tests de sécurité (auth, CSRF, etc.)
