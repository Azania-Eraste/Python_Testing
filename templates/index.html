<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUDLFT Registration</title>
  <style>
    /* Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #eaf4fc, #f7f9fb);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
      text-align: center;
      font-size: 26px;
    }

    p {
      margin-bottom: 20px;
      color: #555;
      text-align: center;
    }

    .card {
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 450px;
      margin-bottom: 30px;
      text-align: center;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    input[type="email"] {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 15px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 16px;
      transition: border 0.3s, box-shadow 0.3s;
    }

    input[type="email"]:focus {
      border-color: #3498db;
      outline: none;
      box-shadow: 0 0 6px rgba(52, 152, 219, 0.4);
    }

    button {
      width: 100%;
      padding: 12px;
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #2980b9;
    }

    h2 {
      margin-bottom: 15px;
      color: #34495e;
      font-size: 20px;
      text-align: center;
    }

    /* Tableau desktop */
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.05);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 14px;
      text-align: left;
      font-size: 15px;
    }

    th {
      background-color: #3498db;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #ecf6fd;
    }

    .table-container {
      width: 100%;
      max-width: 700px;
    }

    /* Version mobile → tableau devient des cards */
    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead {
        display: none; /* on cache les titres */
      }

      tr {
        background: #fff;
        margin-bottom: 15px;
        border-radius: 8px;
        box-shadow: 0px 3px 8px rgba(0,0,0,0.08);
        padding: 12px;
      }

      td {
        border: none;
        padding: 8px 10px;
        display: flex;
        justify-content: space-between;
        font-size: 15px;
      }

      td::before {
        content: attr(data-label);
        font-weight: bold;
        color: #34495e;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Bienvenue sur le GUDLFT Portal</h1>
    <p>Veuillez entrer votre email de secrétaire pour continuer :</p>
    <form action="/welcome" method="post">
      <input type="email" name="email" id="email" placeholder="ex: admin@club.com" required/>
      <button type="submit">Se connecter</button>
    </form>
  </div>

  <div class="card table-container">
    <h2>Tableau des clubs et points</h2>
    <table>
      <thead>
        <tr>
          <th>Nom du Club</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody>
        {% for club in clubs %}
        <tr>
          <td data-label="Nom du Club">{{ club['name'] }}</td>
          <td data-label="Points">{{ club['points'] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</body>
</html>
